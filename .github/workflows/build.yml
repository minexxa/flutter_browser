name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate missing platform assets (icons, etc.)
        run: flutter create . --platforms android

      - name: Prefer Groovy Gradle configs (remove conflicting .kts from flutter create)
        run: |
          rm -f android/build.gradle.kts
          rm -f android/settings.gradle.kts
          rm -f android/app/build.gradle.kts
          # Keep our upgraded wrapper / settings / app build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
